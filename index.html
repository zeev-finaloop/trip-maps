<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Japan trip</title>
<style>
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
       background:#0d2b5e;color:#fff;display:flex;align-items:center;
       justify-content:center;margin:0}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  form{text-align:center;width:min(90vw,320px)}
  h1{font-size:20px;font-weight:600;margin:0 0 4px}
  p{font-size:14px;opacity:.7;margin:0 0 22px}
  input{width:100%;box-sizing:border-box;padding:11px 13px;font-size:16px;
        border:1px solid rgba(255,255,255,.3);border-radius:7px;
        background:rgba(255,255,255,.1);color:#fff}
  input::placeholder{color:rgba(255,255,255,.5)}
  button{width:100%;margin-top:10px;padding:11px;font-size:15px;font-weight:600;
         border:0;border-radius:7px;background:#fff;color:#0d2b5e;cursor:pointer}
  button[disabled]{opacity:.6;cursor:default}
  .err{color:#ffb4b4;font-size:14px;min-height:20px;margin-top:12px}
</style>

<form id="gate">
  <h1>Japan trip</h1>
  <p>Enter the password to open the day plan.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err"></div>

const ITER = 600000;
const STORE = "japan-trip-password";   // sessionStorage: this tab only, gone when it closes

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const err = document.getElementById("err");
const go = document.getElementById("go");
const busy = (on) => { go.disabled = on; go.textContent = on ? "Unlocking\u2026" : "Open"; };

async function unlock(pw) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  try { sessionStorage.setItem(STORE, pw); } catch {}
  // A fresh iframe document gives the page a normal load lifecycle (the map waits for 'load').
  const frame = document.createElement("iframe");
  frame.setAttribute("title", document.title);
  frame.srcdoc = new TextDecoder().decode(plain);
  document.body.replaceChildren(frame);
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  busy(true);
  err.textContent = "";
  try { await unlock(pw); } catch { err.textContent = "Wrong password."; busy(false); }
});

let saved = null;
try { saved = sessionStorage.getItem(STORE); } catch {}
if (saved) {
  busy(true);
  unlock(saved).catch(() => { try { sessionStorage.removeItem(STORE); } catch {} busy(false); });
}
</script>
