const ITER = 600000;
const STORE = "japan-trip-password";   // sessionStorage: this tab only, gone when it closes

const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const err = document.getElementById("err");
const go = document.getElementById("go");
const busy = (on) => { go.disabled = on; go.textContent = on ? "Unlocking\u2026" : "Open"; };

async function unlock(pw) {
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  try { sessionStorage.setItem(STORE, pw); } catch {}
  // A fresh iframe document gives the page a normal load lifecycle (the map waits for 'load').
  const frame = document.createElement("iframe");
  frame.setAttribute("title", document.title);
  frame.srcdoc = new TextDecoder().decode(plain);
  document.body.replaceChildren(frame);
}

document.getElementById("gate").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if (!pw) return;
  busy(true);
  err.textContent = "";
  try { await unlock(pw); } catch { err.textContent = "Wrong password."; busy(false); }
});

let saved = null;
try { saved = sessionStorage.getItem(STORE); } catch {}
if (saved) {
  busy(true);
  unlock(saved).catch(() => { try { sessionStorage.removeItem(STORE); } catch {} busy(false); });
}
</script>
